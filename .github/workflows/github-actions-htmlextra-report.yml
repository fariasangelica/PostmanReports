# Roda a collection do Postman com Newman e gera relatório HTML (htmlextra)

name: "Newman Tests"
on: [push, pull_request]

jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      # Faz checkout do repositório em $GITHUB_WORKSPACE
      - uses: actions/checkout@v6

      # Instala o Node no runner (Node 16 está em fim de vida)
      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      # Instala o Newman e o reporter htmlextra
      - name: Install newman
        run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra

      # Cria a pasta onde o relatório será salvo
      - name: Make Directory for results
        run: mkdir -p testResults

      # O nome do arquivo precisa ser IDÊNTICO ao do repositório (com espaços)
      - name: Run API Tests
        run: newman run "Restful Booker BVT.postman_collection.json" -e "Production.postman_environment.json" -r cli,htmlextra --reporter-htmlextra-export testResults/htmlreport.html

      # Publica o relatório; "always()" garante o upload mesmo se algum teste falhar
      - name: Output the run Details
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: RunReports
          path: testResults
